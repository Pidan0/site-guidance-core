name: Core checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 checked 2026-10-26
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4 checked 2026-10-26
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: node bin/site-core.mjs catalog
      - run: node bin/site-core.mjs demo --out .output/ci-demo
